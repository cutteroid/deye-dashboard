services:
  deye-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deye-dashboard
    ports:
      - "8080:8080"
    # Configuration is read from ./data/.env (the app loads it via python-dotenv).
    # Don't pass settings as `environment:` here — env vars take precedence over
    # .env, so values saved from the dashboard's "Edit configuration" would be ignored.
    # With no ./data/.env, the dashboard starts in first-run onboarding mode.

    volumes:
      # Persistent data files, including .env
      - ./data:/app/data

    restart: unless-stopped

    # Network configuration
    networks:
      - deye-network

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MQTT broker for the smart electricity meter: point the meter at this machine's
  # IP, port 1883, with SMART_METER_MQTT_USER / SMART_METER_MQTT_PASSWORD from
  # data/.env (without them the broker isn't reachable from the network)
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: deye-mosquitto
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]
    ports:
      - "1883:1883"
    env_file:
      - path: ./data/.env
        required: false
    volumes:
      - ./mosquitto/entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - ./data/mosquitto:/mosquitto/data
    restart: unless-stopped
    networks:
      - deye-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  deye-network:
    driver: bridge

